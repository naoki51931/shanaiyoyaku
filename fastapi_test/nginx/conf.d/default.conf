###############################
# 80番 (HTTP)
###############################
server {
    listen 80;
    server_name yoyaku.system-shake-hands.info;

    # Let's Encrypt ACME チャレンジ
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # それ以外は HTTPS へリダイレクト
    location / {
        return 301 https://$host$request_uri;
    }
}

###############################
# 443番 (HTTPS)
###############################
server {
    listen 443 ssl;
    server_name yoyaku.system-shake-hands.info;

    # --- SSL 証明書 ---
    ssl_certificate     /etc/letsencrypt/live/yoyaku.system-shake-hands.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoyaku.system-shake-hands.info/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- React ビルドの配信 ---
    root /usr/share/nginx/html;
    index index.html;

    # ==============================
    # FastAPI の Swagger / OpenAPI
    # ==============================
    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ==============================
    # ★ API ルーティング (/api/* → FastAPI)
    # ==============================
    location /api/ {
        proxy_pass http://api:8000;  # /api のパスを維持したまま転送
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ==============================
    # React SPA
    # ==============================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==============================
    # 静的ファイルキャッシュ
    # ==============================
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

