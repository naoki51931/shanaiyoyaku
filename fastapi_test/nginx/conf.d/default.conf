server {
    listen 80;
    server_name _;

    # ----------------------------------------------------------
    # React build の静的ファイル配信設定
    # ----------------------------------------------------------
    # /usr/share/nginx/html に front_build がマウントされている前提
    root /usr/share/nginx/html;
    index index.html;

    # 静的ファイルはそのまま返す
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------
    # API → FastAPI (api:8000) にルーティング
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8000/;

        # ヘッダーを正しく転送
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----------------------------------------------------------
    # セキュリティ / 最適化（任意）
    # ----------------------------------------------------------
    # gzip 有効化（必要なら）
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # キャッシュ制御（ビルドされた静的ファイルを高速化）
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

