server {
    listen 80;
    server_name _;

    # ----------------------------------------------------------
    # React build の静的ファイル配信
    # ----------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------
    # Swagger UI と OpenAPI を FastAPI にルーティング
    # ----------------------------------------------------------
    location = /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----------------------------------------------------------
    # API ルーティング（全部まとめて FastAPI へ）
    # ----------------------------------------------------------
    # 対象：
    # /auth, /user, /seat, /office, /pasokon,
    # /seat_reservation, /tags, /backups, /backup,
    # /download, /restore
    location ~ ^/(auth|user|seat|office|pasokon|seat_reservation|tags|backups|backup|download|restore)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----------------------------------------------------------
    # React SPA（上記以外はすべてフロントへ）
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------
    # gzip（任意）
    # ----------------------------------------------------------
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # ----------------------------------------------------------
    # 静的ファイルキャッシュ
    # ----------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

