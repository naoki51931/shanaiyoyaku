services:
  db:
    image: mysql:8.0
    container_name: fastapi_test-db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: '%'
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # ← ここがポイント：initdb.d を MySQL 標準の初期化ディレクトリにマウント
      - ./db/data:/var/lib/mysql
      - ./db/log:/var/log/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./db/initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - app_net

  api:
    build: ./be/api
    container_name: fastapi_test-api
    env_file:
      - .env
    volumes:
      - ./be/api:/usr/src/server
      - ./be/api/wait-for-it.sh:/usr/src/server/wait-for-it.sh
    command: ["./wait-for-it.sh", "db:3306", "--", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - db
    ports:
      - "8000:8000"
    networks:
      - app_net

  front:
    build: ./fe/front
    container_name: fastapi_test-front
    env_file:
      - .env
    volumes:
      - ./fe/front/build:/tmp/build
    depends_on:
      - api
    expose:
      - "3000"
    networks:
      - app_net

  nginx:
    image: nginx:latest
    container_name: fastapi_test-nginx
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fe/front/build:/usr/share/nginx/html
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    depends_on:
      - front
      - api
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app_net

  certbot:
    image: certbot/certbot
    container_name: fastapi_test-certbot
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    networks:
      - app_net
    # 通常は run で一回きり実行するので、ここでは常駐させない

networks:
  app_net:
    driver: bridge

